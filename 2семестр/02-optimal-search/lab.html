window.LAB = {

  task: [
    'Тест из пособия: веса 60, 30, 10 — получить матрицы AW, AP, AR, обход слева направо и среднюю высоту 1.50.',

    'n = 100, случайные веса от 1 до 100 (<code>srand(2024)</code>): обход слева направо и сверка <code>AP[0][n]</code> со средневзвешенной высотой построенного дерева.',

  chips: [{ t: 'точный O(n³)', cls: 'plain' }, { t: 'память O(n²)', cls: 'plain' }, { t: 'AP/AW — ср. высота', cls: 'm' }],
  hint: 'Веса — положительные числа через пробел (частоты обращений), не больше 8. Пример из пособия: 60 30 10.',

  pseudo: [

      ['                    min = x;', 'ap'],

      ['            Ap[i][j] = min + Aw[i][j];', 'ap'],

      ['        }', ''],
      ['    }', ''],
