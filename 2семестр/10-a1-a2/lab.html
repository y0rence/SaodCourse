<body>
<script src="../../assets/gens/g4-trees-b.js"></script>
<script>
window.LAB = {
  base: '../../',
  num: '10',
  title: 'Приближённые деревья поиска A1 и A2',
  algo: 'A1 · A2 · ДОП',
  crumb: '2 семестр · Деревья поиска',
  lead: 'Вес ключа — частота обращений. A1 вставляет ключи по убыванию веса, A2 выбирает корень около середины суммарного веса интервала, точный ДОП минимизирует средневзвешенную глубину перебором корней.',
  task: [
    'Программа сама генерирует 100 различных ключей от 1 до 1000 и назначает каждому вес от 1 до 100.',
    'Построить три дерева на одних и тех же ключах и весах: A1, A2 и точный ДОП.',
    'Вывести исходные пары, обходы слева направо A1 и A2 (ключи по возрастанию) и таблицу сравнения: Size, Sum, Height, AvWeigh Height.',
    'Сравнить последний столбец: средневзвешенная глубина у точного ДОП должна быть наименьшей; размер и сумма ключей у всех трёх деревьев совпадают.'
  ],
  chips: [{ t: 'A1 · A2 · ДОП', cls: 'plain' }, { t: 'Σ(вес × уровень) / Σвес', cls: 'plain' }, { t: 'ДОП минимален', cls: 'plain' }],
  hint: 'Пары «ключ:вес» через пробел, до 16 ключей. Вес — частота поиска ключа (1…100).',
  inputs: [{ id: 'pairs', label: 'Ключи и веса', value: '20:15 30:15 40:11 50:16 60:13 70:26 80:28', example: '20:15 30:15 40:11 50:16 60:13 70:26 80:28', placeholder: '50:8 30:6 70:4 20:20' }],
  example: true,
  max: 16,
  parse: function (vals) {
    var raw = String(vals.pairs == null ? '' : vals.pairs).trim();
    if (!raw) return [];
    var out = [];
    raw.split(/[\s,;]+/).filter(Boolean).forEach(function (tok) {
      var p = tok.split(/[:/]/);
      var k = Number(p[0]);
      var w = p.length > 1 ? Number(p[1]) : 1;
      if (!isNaN(k) && !isNaN(w)) out.push({ v: k, w: w });
    });
    return out.slice(0, 16);
  },
  pseudo: [
    ['A1 — корень: вершина с наибольшим весом (п. 14.3, с. 77)', 'sig'],
    ['Root := NIL', 'sig'],
    ['DO (i = 1,…,n): выбрать невставленный V[j] с максимальным w', 'a1pick'],
    ['    Добавление в СДП (Root, V[index])', 'a1ins'],
    ['OD', 'a1pick'],
    ['A2 — «центр тяжести» (п. 14.3, с. 78):', 'a2'],
    ['IF (L ≤ R)', 'a2'],
    ['    wes := Σ V[i].w, i = L…R; summa := 0', 'a2thr'],
    ['    DO (i = L,…,R−1)', 'a2thr'],
    ['        IF (summa < wes/2 и summa + V[i].w ≥ wes/2) OD', 'a2thr'],
    ['        summa := summa + V[i].w', 'a2thr'],
    ['    OD', 'a2thr'],
    ['    Добавление в СДП (Root, V[i])', 'a2rec'],
    ['    A2 (Root, L, i−1); A2 (Root, i+1, R)', 'a2rec'],
    ['FI', 'a2'],
    ['ДОП (п. 14.2): перебор k ⊂ (AR[i][j−1] … AR[i+1][j])', 'dopdp'],
    ['    Api,j := min + Awi,j; Ari,j := m', 'dopdp'],
    ['    k := AR[L][R]; Добавить (Root, V[k])', 'dopbuild'],
    ['    Создание дерева (L, k−1); Создание дерева (k+1, R)', 'dopbuild'],
    ['AvWeighHeight = Σ (уровень × вес) / Σ вес   — корень на уровне 1', 'stat']
  ],
  file: {
    name: 'a1_a2.cpp',
    url: '2семестр/10-a1-a2/a1_a2.cpp',
    lines: [
      ['Vertex *BuildA1(Item arr[], int n) {', 'a1pick'],
      ['    sort(arr, arr + n, [](const Item &a, const Item &b) { return a.weight > b.weight; });', 'a1pick'],
      ['    Vertex *root = nullptr;', 'a1pick'],
      ['    for (int i = 0; i < n; i++) {', 'a1ins'],
      ['        AddRec(arr[i].data, arr[i].weight, root);', 'a1ins'],
      ['    }', 'a1ins'],
      ['    return root;', 'a1pick'],
      ['}', 'a1pick'],
      ['void A2(Item arr[], int L, int R, Vertex *&root) {', 'a2'],
      ['    if (L > R)', 'a2'],
      ['        return;', 'a2'],
      ['    int wes = 0;', 'a2thr'],
      ['    for (int i = L; i <= R; i++) {', 'a2thr'],
      ['        wes += arr[i].weight;', 'a2thr'],
      ['    }', 'a2thr'],
      ['    int sum = 0;', 'a2thr'],
      ['    int idx = L;', 'a2thr'],
      ['    for (; idx <= R; idx++) {', 'a2thr'],
      ['        if (sum < wes / 2 && sum + arr[idx].weight >= wes / 2) {', 'a2thr'],
      ['            break;', 'a2thr'],
      ['        }', 'a2thr'],
      ['        sum += arr[idx].weight;', 'a2thr'],
      ['    }', 'a2thr'],
      ['    if (idx > R) {', 'a2thr'],
      ['        idx = R;', 'a2thr'],
      ['    }', 'a2thr'],
      ['    AddRec(arr[idx].data, arr[idx].weight, root);', 'a2rec'],
      ['    A2(arr, L, idx - 1, root);', 'a2rec'],
      ['    A2(arr, idx + 1, R, root);', 'a2rec'],
      ['}', 'a2rec']
    ]
  },
  details: [
    { s: 'Трудоёмкость', h: '<p><b>A1:</b> сортировка <code>O(n log n)</code> плюс n вставок в СДП — в сумме <code>O(n log n)</code> в среднем. <b>A2:</b> на каждом шаге рекурсии считается сумма весов интервала — в среднем <code>O(n log n)</code>, в худшем <code>O(n²)</code>. <b>ДОП:</b> перебор корней с ограничением <code>AR[i][j−1] … AR[i+1][j]</code> — <code>O(n²)</code>.</p>' },
    { s: 'Средневзвешенная глубина', h: '<p><code>P = Σ wᵢ·hᵢ</code>, где <code>hᵢ</code> — уровень вершины (корень на уровне 1); среднее число сравнений при успешном поиске равно <code>P / Σwᵢ</code>.</p><p>Пример из пособия: ключи 10, 20, 30 с весами 4, 3 и 3. A1 вставляет первым ключ 10 (самый тяжёлый) и делает его корнем; у A2 порог равен 5, накопленный вес достигает его на ключе 20 — он становится корнем. Среднее число сравнений: (4·2 + 3·1 + 3·2) / 10 = <b>1,7</b>.</p>' },
    { s: 'Проверка правильности', h: '<p>Во всех трёх деревьях совпадают размер и сумма ключей — набор один и тот же, меняется только форма. Обходы слева направо дают ключи по возрастанию. Средневзвешенная глубина ДОП не больше, чем у A1 и A2: эвристики дают приближение, а ДОП — минимум.</p>' }
  ],
  links: [
    { href: 'README.md', label: 'README' },
    { href: 'a1_a2.cpp', label: 'Исходный код' },
    { href: 'THEORY.md', label: 'Теория' },
    { href: '../../2семестр/README.md', label: 'Все работы 2 семестра' }
  ],
  dockTitle: 'A1 · A2 · ДОП',
  dockDesc: 'Псевдокод из пособия и настоящий исходник — переключайтесь вкладками',
  steps: function (data) { return Lab.gen.a1a2(data); }
};
</script>
