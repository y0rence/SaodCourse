name: Проверки страниц лаб

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lab-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Синтаксис движка и генераторов
        run: |
          node --check assets/lab.js
          for f in assets/gens/*.js scripts/*.js; do node --check "$f"; done

      - name: Страницы: конфиг, ссылки, теги
        run: node scripts/check-lab.js $(find . -name lab.html | sort)

      - name: Страницы: прогон шагов
        run: node scripts/run-steps.js $(find . -name lab.html | sort)

      - name: README в монохромном стиле (без эмодзи и цветных бейджей)
        run: python3 scripts/readme-monochrome.py

      - name: README не изменён чисткой (стиль соблюдён)
        run: git diff --exit-code -- '**/README*.md'
