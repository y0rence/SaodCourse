  task: [

  chips: [{ t: 'O(m) худший', cls: 'plain' }, { t: 'O(1) в среднем', cls: 'plain' }, { t: 'линейные пробы', cls: 'm' }],
  hint: 'Ключи — числа через пробел (до 16); m — простое (11, 13, 17, 19, 23, 29). Нужно n < m: если ключей не меньше m, m увеличивается до простого — таблица не переполняется.',

    var m = parseInt(v.m, 10);
    if (!m || m < 2) m = 11;
    if (m > 101) m = 101;
    function nextPrime(x) {
      for (;;) {
        x++;
        var ok = true;
        for (var d = 2; d * d <= x; d++) if (x % d === 0) { ok = false; break; }
        if (ok) return x;
      }
    }
    while (keys.length >= m) m = nextPrime(m);
    return { keys: keys, m: m };
