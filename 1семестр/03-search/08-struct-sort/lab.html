window.LAB = {

  task: [

    'Реализовать функцию сравнения абонентов по ключу минимум из двух полей записи.',
    'Вывести на экран исходный и отсортированный справочник; предусмотреть смену ключа и направления сортировки через функцию сравнения.',
    '6*. Реализовать быстрый двоичный поиск по старшей части сложного ключа.'
  ],
  chips: [{ t: 'O(n²)', cls: 'plain' }, { t: 'устойчивая', cls: 'plain' }],
  hint: 'Записи через запятую: «Фамилия Имя, Фамилия Имя, …» — до 16 записей; второе поле — фамилия для поиска.',
  example: true,
  inputs: [
    {
      id: 'data',
      label: 'Справочник',
      value: 'Иванов Андрей, Петров Борис, Сидоров Илья, Иванов Алексей, Кузнецов Олег',
      example: 'Иванов Андрей, Петров Борис, Сидоров Илья, Иванов Алексей, Кузнецов Олег',

  parse: function (vals) {
    var recs = String(vals.data == null ? '' : vals.data)
      .split(',').map(function (s) { return s.trim(); }).filter(Boolean)
      .map(function (s) {
        var p = s.split(/\s+/);
        return { last: p[0], first: p.slice(1).join(' ') };
      })
      .filter(function (r) { return !!r.last; });
    if (recs.length > 16) recs = recs.slice(0, 16);
    var x = String(vals.x == null ? '' : vals.x).trim();
    if (!recs.length || !x) return null;
    return { recs: recs, x: x };
  },
  pseudo: [

    ['    IF x.Фамилия < y.Фамилия THEN Less ← истина', 'less cmp'],

    ['    OD', 'scan'],

      ['    char street[kTextSize];', 'sig'],
      ['    char phone[kTextSize];', 'sig'],
      ['} Subscriber;', 'sig'],
      ['', ''],
      ['int CompareSubscribers(const Subscriber *left, const Subscriber *right) {', 'less'],
      ['    int result = strcmp(left->last_name, right->last_name);', 'less cmp'],
      ['    if (result != 0) {', 'less cmp'],
      ['        return result;', 'less cmp'],
      ['    }', 'less cmp'],
      ['    return strcmp(left->first_name, right->first_name);', 'less cmp2'],
      ['}', 'less'],
      ['', ''],
      ['void InsertionSort(Subscriber directory[], int size) {', 'ins'],
      ['    for (int i = 1; i < size; ++i) {', 'ins'],
      ['        Subscriber current = directory[i];', 'take'],
      ['        int j = i - 1;', 'take'],
      ['', ''],
      ['        while (j >= 0 && CompareSubscribers(&directory[j], &current) > 0) {', 'scan cmp'],
      ['            directory[j + 1] = directory[j];', 'shift'],
      ['            --j;', 'shift'],
      ['        }', 'scan'],
      ['', ''],
      ['        directory[j + 1] = current;', 'put'],
      ['    }', 'ins'],
      ['}', ''],
      ['', ''],
      ['int BinarySearchByLastName(const Subscriber directory[], int size, const char *last_name) {', 'bsig'],
      ['    int left = 0;', 'bsig'],
      ['    int right = size - 1;', 'bsig'],
      ['    if (size <= 0) {', ''],
      ['        return -1;', ''],
      ['    }', ''],
      ['', ''],
      ['    while (left < right) {', 'bloop'],
      ['        int middle = (left + right) / 2;', 'bmid'],
      ['', ''],
      ['        if (strcmp(directory[middle].last_name, last_name) < 0) {', 'bright'],
      ['            left = middle + 1;', 'bright'],
      ['        } else {', 'bleft'],
      ['            right = middle;', 'bleft'],
      ['        }', ''],
      ['    }', 'bloop'],
      ['', ''],
      ['    return strcmp(directory[right].last_name, last_name) == 0 ? right : -1;', 'bfound'],
      ['}', ''],
      ['', ''],
      ['    printf("\\nТелефонный справочник после сортировки:\\n");', 'done'],
      ['    PrintDirectory(directory, kSubscribersCount);', 'done']
    ]
  },
  details: [
    { s: 'Трудоёмкость', h: '<p><b>Сортировка включением:</b> <code>C = O(n²)</code>, <code>M = O(n²)</code> — сильная зависимость от упорядоченности, устойчивая. <b>Двоичный поиск:</b> <code>C = O(log n)</code>. Направление сортировки меняется заменой <code>&lt;</code> на <code>&gt;</code> внутри функции сравнения; пересылка записи — обычное копирование, переопределять её не нужно.</p>' },
    { s: 'Проверка правильности', h: '<p>Справочник печатается до и после сортировки. Поиск проверяется на существующей фамилии (выводятся все однофамильцы) и на отсутствующей. В <code>task2_phonebook.c</code> счётчиков нет: <b>C</b> — число <code>strcmp</code> ключей, <b>M</b> — число пересылок записей.</p>' },

  ],
